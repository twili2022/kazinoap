<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>TagenGram ❄️</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#090510; --card:#160d24; --card-2:#201334; --card-3:#2c1947;
  --border:#45276e; --text:#fff; --dim:#b8a8d1;
  --accent:#c77dff; --accent-bright:#e0aaff; --accent-dk:#7b2cbf;
  --gold:#ffd700; --gold-bright:#ffe066; --gold-dk:#b8860b;
  --ok:#10b981; --bad:#ef4444;
  --neon-border: 0 0 0 1px rgba(199,125,255,0.45), 0 0 12px rgba(157,78,221,0.28);
  --neon-strong: 0 0 0 1px rgba(224,170,255,0.7), 0 0 18px rgba(199,125,255,0.45), inset 0 1px 0 rgba(255,255,255,0.16);
  --gold-border: 0 0 0 1px rgba(255,215,0,0.55), 0 0 14px rgba(255,215,0,0.35);
  --depth-shadow: 0 10px 24px rgba(0,0,0,0.65), 0 4px 0 #0a0512;
}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{
  font-family:'Segoe UI',Roboto,-apple-system,sans-serif;color:var(--text);
  height:100vh;height:100dvh;
  background:
    radial-gradient(circle at 15% 10%,rgba(157,78,221,.24),transparent 42%),
    radial-gradient(circle at 88% 22%,rgba(56,189,248,.14),transparent 38%),
    radial-gradient(circle at 50% 85%,rgba(199,125,255,.16),transparent 45%),
    var(--bg);
  display:flex;flex-direction:column;
}
#snowCanvas{position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.78}

.topbar{
  position:sticky;top:0;z-index:50;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:10px 13px;
  background:rgba(15,8,26,.94);backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(199,125,255,.35);
  box-shadow:0 6px 20px rgba(0,0,0,.6);
  flex-shrink:0;
}
.brand-wrap{display:flex;align-items:center;gap:7px;cursor:pointer}
.brand-name{font-size:15.5px;font-weight:900;letter-spacing:.6px;text-transform:uppercase;text-shadow:0 0 12px rgba(199,125,255,.5)}
.brand-name span{color:var(--accent-bright)}
.top-right{display:flex;align-items:center;gap:6px}
.sound-btn{
  background:linear-gradient(155deg,var(--card-3),var(--card-2));
  border:1px solid rgba(199,125,255,.5);border-radius:11px;
  width:34px;height:34px;display:flex;align-items:center;justify-content:center;
  font-size:15px;cursor:pointer;color:#fff;box-shadow:0 3px 0 #0b0514;
}
.sound-btn.muted{opacity:.55;border-color:rgba(239,68,68,.5)}
.bal-chip{
  background:linear-gradient(160deg,var(--card-3),var(--card-2));
  border:1px solid rgba(199,125,255,.5);
  border-radius:11px;padding:4px 8px;
  font-size:11px;font-weight:800;line-height:1.12;
  box-shadow:0 3px 0 #0b0514;cursor:pointer;white-space:nowrap;
}
.bal-chip.stars{border-color:rgba(255,215,0,.55)}
.bal-chip small{display:block;font-size:8.5px;color:var(--gold-bright);font-weight:900}

.page-screen{display:none;flex-direction:column;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:calc(92px + env(safe-area-inset-bottom));position:relative;z-index:2}
.page-screen.active{display:flex}
.pad{padding:14px}

.chat-row{
  display:flex;align-items:center;gap:12px;
  background:linear-gradient(155deg,var(--card-2),var(--card));
  border:1px solid rgba(199,125,255,.38);
  border-radius:18px;padding:11px 12px;margin-bottom:9px;
  box-shadow:var(--depth-shadow);cursor:pointer;transition:transform .12s;
}
.chat-row:active{transform:translateY(2px)}
.avatar-circle{
  position:relative;width:52px;height:52px;border-radius:17px;flex-shrink:0;
  background:linear-gradient(145deg,var(--accent-bright),var(--accent-dk));
  color:#090510;font-size:21px;font-weight:900;
  display:flex;align-items:center;justify-content:center;
  border:1px solid rgba(255,215,0,.55);overflow:hidden;
}
.avatar-circle img{width:100%;height:100%;object-fit:cover}
.online-dot{
  position:absolute;bottom:2px;right:2px;width:11px;height:11px;border-radius:50%;
  background:var(--ok);border:2px solid #160d24;box-shadow:0 0 8px var(--ok);
}
.unread-badge{
  background:linear-gradient(145deg,var(--gold-bright),var(--gold));
  color:#090510;font-size:11px;font-weight:900;
  min-width:22px;height:22px;padding:0 6px;border-radius:999px;
  display:flex;align-items:center;justify-content:center;
}

#screen-room{padding-bottom:0;overflow:hidden}
.room-header{
  display:flex;align-items:center;gap:10px;padding:10px 12px;
  background:rgba(22,13,36,.96);border-bottom:1px solid rgba(199,125,255,.4);
  flex-shrink:0;
}
.room-messages{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:9px}
.msg-wrap{display:flex;flex-direction:column;max-width:82%}
.msg-wrap.mine{align-self:flex-end;align-items:flex-end}
.msg-wrap.other{align-self:flex-start;align-items:flex-start}
.msg-sender{font-size:11px;font-weight:800;color:var(--accent-bright);margin-bottom:3px;cursor:pointer}
.msg-bubble{
  background:linear-gradient(155deg,var(--card-3),var(--card-2));
  border:1px solid rgba(199,125,255,.45);
  border-radius:18px 18px 18px 6px;padding:10px 13px;
  font-size:14px;line-height:1.4;word-break:break-word;
  box-shadow:0 4px 12px rgba(0,0,0,.45);
}
.msg-wrap.mine .msg-bubble{
  background:linear-gradient(145deg,#4c1d95,#2e1065);
  border-color:rgba(255,215,0,.55);
  border-radius:18px 18px 6px 18px;
}
.msg-time{font-size:9.5px;color:var(--dim);margin-top:4px;text-align:right}

.chat-gift-card{
  width:218px;border-radius:18px;padding:12px;text-align:center;
  background:linear-gradient(160deg,#2a1647,#150a26);
  border:1px solid rgba(255,215,0,.65);
  box-shadow:0 8px 20px rgba(0,0,0,.6),var(--gold-border);cursor:pointer;
}
.chat-gift-badge{display:inline-block;font-size:10px;font-weight:900;background:rgba(255,215,0,.2);color:var(--gold-bright);border:1px solid rgba(255,215,0,.5);padding:2px 8px;border-radius:999px;margin-bottom:8px}

.room-composer{
  display:flex;align-items:center;gap:7px;
  padding:9px 10px calc(9px + env(safe-area-inset-bottom));
  background:rgba(16,9,28,.97);border-top:1px solid rgba(199,125,255,.45);
  flex-shrink:0;z-index:130;
}
.room-composer input[type="text"]{margin-bottom:0;border-radius:999px;padding:10px 14px;font-size:14px}
.icon-round-btn{
  width:40px;height:40px;border-radius:50%;flex-shrink:0;border:1px solid rgba(199,125,255,.5);
  background:linear-gradient(155deg,var(--card-3),var(--card-2));color:#fff;font-size:18px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.icon-round-btn.send{background:linear-gradient(145deg,var(--gold-bright),var(--gold));color:#090510;border-color:#fff;font-weight:900}

.tg-profile-hero{
  border-radius:24px;overflow:hidden;
  background:linear-gradient(160deg,var(--card-2),var(--card));
  border:1px solid rgba(199,125,255,.5);
  box-shadow:var(--depth-shadow),var(--neon-border);
  margin-bottom:13px;
}
.tg-profile-banner{
  height:96px;width:100%;position:relative;
  background:linear-gradient(135deg,#3b1668 0%,#190b2e 55%,#0e294b 100%);
}
.tg-profile-body{padding:0 16px 18px;text-align:center;margin-top:-44px;position:relative;z-index:2}
.tg-profile-avatar{
  width:88px;height:88px;border-radius:28px;margin:0 auto 10px;
  background:linear-gradient(145deg,var(--accent-bright),var(--accent-dk));
  color:#090510;font-size:36px;font-weight:900;
  display:flex;align-items:center;justify-content:center;
  border:3px solid #160d24;box-shadow:0 8px 22px rgba(0,0,0,.65),var(--gold-border);
  overflow:hidden;
}
.tg-profile-avatar img{width:100%;height:100%;object-fit:cover}
.tg-stats-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.tg-stat-box{background:rgba(10,5,20,.65);border:1px solid rgba(199,125,255,.32);border-radius:14px;padding:8px 6px}
.tg-stat-num{font-size:15px;font-weight:900;color:#fff}
.tg-stat-lbl{font-size:10px;color:var(--dim);font-weight:700;margin-top:2px}

.tg-tabs-bar{display:flex;gap:8px;margin-bottom:12px}
.tg-tab-btn{
  flex:1;padding:10px;border-radius:14px;border:1px solid rgba(199,125,255,.38);
  background:linear-gradient(155deg,var(--card-2),var(--card));
  color:var(--dim);font-size:12.5px;font-weight:900;cursor:pointer;
}
.tg-tab-btn.active{
  color:#090510;background:linear-gradient(145deg,var(--gold-bright),var(--gold));
  border-color:#fff;box-shadow:0 4px 14px rgba(255,215,0,.35);
}

.gifts-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.gift-card{
  background:linear-gradient(160deg,#211336,#140b21);
  border:1px solid rgba(199,125,255,.42);border-radius:19px;padding:10px;
  display:flex;flex-direction:column;box-shadow:var(--depth-shadow),var(--neon-border);
  position:relative;cursor:pointer;transition:transform .12s;
}
.gift-card:active{transform:scale(.98)}
.gift-card.pinned-card{border-color:rgba(255,215,0,.72);box-shadow:var(--depth-shadow),var(--gold-border)}
.pin-badge{
  position:absolute;top:14px;right:14px;z-index:4;
  background:rgba(10,5,20,.82);border:1px solid rgba(255,215,0,.65);
  color:var(--gold-bright);font-size:10px;font-weight:900;
  padding:2px 7px;border-radius:999px;
}
.serial-badge{
  position:absolute;top:14px;left:14px;z-index:4;
  background:rgba(10,5,20,.78);border:1px solid rgba(224,170,255,.45);
  color:var(--accent-bright);font-size:10px;font-weight:900;
  padding:2px 7px;border-radius:999px;
}
.gift-art-box{
  position:relative;width:100%;aspect-ratio:1/0.92;border-radius:14px;overflow:hidden;
  display:flex;align-items:center;justify-content:center;margin-bottom:9px;
  border:1px solid rgba(255,255,255,.12);
}
.gift-art-pattern{
  position:absolute;inset:0;opacity:.14;
  background-image:radial-gradient(#fff 1.5px,transparent 1.5px),radial-gradient(#fff 1.5px,#0000 1.5px);
  background-size:22px 22px;background-position:0 0,11px 11px;pointer-events:none;
}
.gift-art-inner{position:relative;z-index:2;width:76%;height:76%;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45))}
.gift-art-inner img{width:100%;height:100%;object-fit:contain}
.gift-name{font-size:14px;font-weight:900;color:#fff;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rarity-pill{font-size:10px;font-weight:900;padding:2px 7px;border-radius:6px;display:inline-block}
.rarity-pill.Legendary{background:rgba(249,115,22,.22);color:#fdba74;border:1px solid rgba(249,115,22,.5)}
.rarity-pill.Epic{background:rgba(234,179,8,.22);color:#fde047;border:1px solid rgba(234,179,8,.5)}
.rarity-pill.Rare{background:rgba(59,130,246,.22);color:#93c5fd;border:1px solid rgba(59,130,246,.5)}
.gift-price-ton{font-size:14px;font-weight:900;color:#f59e0b;margin-top:6px}

.search-box{position:relative;margin-bottom:11px}
.search-box input{width:100%;padding:11px 14px 11px 36px;background:rgba(16,9,28,.9);border:1px solid rgba(199,125,255,.45);border-radius:14px;color:#fff;font-size:14px;outline:none;margin-bottom:0}
.search-box::before{content:'🔍';position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:13px;opacity:.75}
.filter-pills{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;scrollbar-width:none}
.filter-pills::-webkit-scrollbar{display:none}
.f-pill{flex-shrink:0;padding:7px 13px;border-radius:12px;background:linear-gradient(155deg,var(--card-2),var(--card));border:1px solid rgba(199,125,255,.38);color:var(--dim);font-size:12px;font-weight:800;cursor:pointer}
.f-pill.active{color:#fff;background:linear-gradient(145deg,#3b1d66,#241142);border-color:var(--accent-bright);box-shadow:var(--neon-strong)}

.btn-main{width:100%;padding:12px;border:1px solid rgba(255,255,255,.35);border-radius:14px;background:linear-gradient(145deg,var(--accent-bright),var(--accent));color:#090510;font-weight:900;font-size:13px;cursor:pointer;text-transform:uppercase;letter-spacing:.5px;box-shadow:0 4px 0 #4a148c}
.btn-gold{background:linear-gradient(145deg,var(--gold-bright),var(--gold))!important;color:#090510!important;box-shadow:0 4px 0 var(--gold-dk)!important}
.btn-green{background:linear-gradient(145deg,#34d399,#059669)!important;color:#04130d!important;box-shadow:0 4px 0 #064e3b!important}
.btn-grey{background:linear-gradient(155deg,var(--card-3),var(--card-2));color:#fff;border:1px solid rgba(199,125,255,.42);font-size:12px;padding:9px 12px;border-radius:12px;font-weight:800;cursor:pointer}
.btn-danger{background:linear-gradient(145deg,#f87171,var(--bad));color:#fff;border:1px solid rgba(255,255,255,.25);padding:10px 12px;border-radius:12px;font-weight:800;cursor:pointer}
input[type="text"],input[type="number"],input[type="password"],select.styled-select{
  width:100%;padding:11px 13px;background:rgba(11,6,20,.88);border:1px solid rgba(199,125,255,.45);
  border-radius:13px;color:#fff;font-size:14px;margin-bottom:10px;outline:none;font-family:inherit;
}
.panel-card{background:linear-gradient(155deg,var(--card-2),var(--card));border:1px solid rgba(199,125,255,.45);border-radius:20px;padding:15px;margin-bottom:13px;box-shadow:var(--depth-shadow),var(--neon-border)}
.panel-card h3{font-size:13px;font-weight:900;color:var(--gold-bright);text-transform:uppercase;letter-spacing:.6px;margin-bottom:11px}

.bottom-nav{
  position:fixed;left:8px;right:8px;bottom:8px;z-index:120;
  display:flex;justify-content:space-around;
  padding:8px 4px calc(8px + env(safe-area-inset-bottom));
  background:rgba(18,10,32,.95);backdrop-filter:blur(20px);
  border:1px solid rgba(199,125,255,.55);border-radius:22px;
  box-shadow:0 10px 28px rgba(0,0,0,.85),var(--neon-strong);
}
.nav-item{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  padding:5px 4px;border-radius:14px;cursor:pointer;border:1px solid transparent;
  background:transparent;color:var(--dim);font-size:10px;font-weight:800;font-family:inherit;flex:1;
}
.nav-item .ni{font-size:19px;line-height:1}
.nav-item.active{color:var(--accent-bright);background:rgba(199,125,255,.15);border-color:rgba(224,170,255,.55)}

.modal{display:none;position:fixed;inset:0;background:rgba(5,2,10,.86);backdrop-filter:blur(7px);align-items:center;justify-content:center;z-index:300;padding:14px}
.modal.show{display:flex}
.modal .box{background:linear-gradient(160deg,var(--card-2),var(--card));border:1px solid rgba(255,215,0,.55);border-radius:24px;padding:18px;width:100%;max-width:390px;max-height:90vh;overflow-y:auto;box-shadow:var(--depth-shadow),var(--gold-border)}
#toastContainer{position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;width:90%;max-width:390px}
.toast{background:linear-gradient(145deg,#fff,#f3e8ff);color:#090510;padding:10px 15px;border-radius:13px;font-weight:800;font-size:13px;text-align:center;border:1px solid var(--gold-bright);box-shadow:0 6px 20px rgba(0,0,0,.55);animation:fadeToast 2.8s forwards}
@keyframes fadeToast{0%{opacity:0;transform:translateY(-8px)}10%{opacity:1;transform:translateY(0)}88%{opacity:1}100%{opacity:0}}
</style>
</head>
<body>

<canvas id="snowCanvas"></canvas>
<div id="toastContainer"></div>

<div id="authScreen" class="page-screen active" style="justify-content:center;align-items:center;padding:20px;z-index:100;">
  <div style="text-align:center;margin-bottom:20px;">
    <div style="font-size:48px;margin-bottom:6px;filter:drop-shadow(0 0 16px rgba(199,125,255,.7));">❄️</div>
    <h1 style="font-size:28px;font-weight:900;text-transform:uppercase;text-shadow:0 4px 0 #2d0a4e,0 0 18px rgba(199,125,255,.55);">TAGEN <span style="color:var(--accent-bright)">GRAM</span></h1>
    <div style="color:var(--gold-bright);font-size:11px;letter-spacing:2.5px;text-transform:uppercase;margin-top:4px;">Messenger &amp; NFT Gifts</div>
  </div>
  <div style="width:100%;max-width:360px;background:linear-gradient(160deg,var(--card-2),var(--card));padding:22px 18px;border-radius:24px;border:1px solid rgba(255,215,0,.5);box-shadow:var(--depth-shadow),var(--gold-border);">
    <h2 id="authTitle" style="text-align:center;margin-bottom:16px;font-size:17px;text-transform:uppercase;color:var(--gold-bright);">Вход в TagenGram</h2>
    <input type="text" id="authLogin" placeholder="@username (напр. tagen)" autocomplete="username">
    <input type="text" id="authDisplayName" placeholder="Отображаемое имя" style="display:none;">
    <input type="password" id="authPassword" placeholder="Пароль" autocomplete="current-password">
    <button class="btn-main btn-gold" id="mainAuthBtn">Войти</button>
    <button class="btn-grey" id="switchAuthMode" style="width:100%;margin-top:10px;">Создать новый @username</button>
  </div>
</div>

<header class="topbar" id="topHeader" style="display:none;">
  <div class="brand-wrap" onclick="playSfx('click');switchTab('chats')">
    <span style="font-size:18px;">❄️</span>
    <div class="brand-name">TAGEN <span>GRAM</span></div>
  </div>
  <div class="top-right">
    <button class="sound-btn" id="soundToggleBtn" onclick="toggleSound()" title="Звук">🔊</button>
    <div class="bal-chip" onclick="playSfx('click');switchTab('profile')"><div id="topTonVal">0</div><small>TON</small></div>
    <div class="bal-chip stars" onclick="playSfx('click');switchTab('profile')"><div id="topStarsVal">0</div><small>★</small></div>
  </div>
</header>

<div id="screen-chats" class="page-screen">
  <div class="pad">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
      <h2 style="font-size:20px;font-weight:900;">💬 Чаты</h2>
      <button class="btn-grey" onclick="playSfx('click');switchTab('contacts')">+ Новый чат</button>
    </div>
    <div id="chatsList"></div>
  </div>
</div>

<div id="screen-room" class="page-screen">
  <div class="room-header">
    <button class="btn-grey" style="padding:7px 11px;" onclick="playSfx('click');exitChatRoom()">←</button>
    <div id="roomPeerInfo" style="flex:1;min-width:0;cursor:pointer;" onclick="playSfx('click');openCurrentPeerProfile()">
      <div id="roomTitle" style="font-size:15px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">Чат</div>
      <div id="roomSub" style="font-size:11px;color:var(--ok);font-weight:700;">в сети</div>
    </div>
    <button class="btn-main btn-gold" style="width:auto;padding:7px 11px;font-size:11px;" onclick="playSfx('click');openSendGiftInChat()">🎁 Подарок</button>
  </div>

  <div class="room-messages" id="roomMessages"></div>

  <div class="room-composer">
    <label class="icon-round-btn" title="Фото">
      📷
      <input type="file" id="chatPhotoInput" accept="image/*" style="display:none;" onchange="sendChatImage(this)">
    </label>
    <input type="text" id="chatMsgInput" placeholder="Сообщение..." onkeydown="if(event.key==='Enter')sendChatText()">
    <button class="icon-round-btn send" onclick="sendChatText()">➤</button>
  </div>
</div>

<div id="screen-contacts" class="page-screen">
  <div class="pad">
    <h2 style="font-size:20px;font-weight:900;margin-bottom:12px;">👥 Люди</h2>
    <div class="search-box">
      <input type="text" id="usersSearchInput" placeholder="Поиск по @username или имени..." oninput="loadContacts()">
    </div>
    <div id="contactsList"></div>
  </div>
</div>

<div id="screen-gifts" class="page-screen">
  <div class="pad">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
      <h2 style="font-size:20px;font-weight:900;">🎁 Подарки <span id="giftsCount" style="color:var(--dim);font-size:15px;">(0)</span></h2>
      <select class="btn-grey" id="giftsSort" onchange="playSfx('click');renderGiftsStore()">
        <option value="popular">Популярные</option>
        <option value="price_desc">Дороже</option>
        <option value="price_asc">Дешевле</option>
      </select>
    </div>
    <div class="search-box">
      <input type="text" id="giftsSearch" placeholder="Поиск подарка..." oninput="renderGiftsStore()">
    </div>
    <div class="filter-pills" id="giftsFilters">
      <button class="f-pill active" onclick="setGiftFilter('all', this)">Все</button>
      <button class="f-pill" onclick="setGiftFilter('NFT', this)">💎 NFT</button>

let audioCtx = null;
function getAudioCtx() {
  if (!SOUND_ENABLED) return null;
  if (!audioCtx) {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (Ctx) audioCtx = new Ctx();
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
  return audioCtx;
}

function playTone(freq, duration = 0.09, type = 'sine', gainVal = 0.08, delay = 0, slideTo = null) {
  const ctx = getAudioCtx();
  if (!ctx) return;
  const start = ctx.currentTime + delay;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, start);
  if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, start + duration);
  gain.gain.setValueAtTime(0.0001, start);
  gain.gain.linearRampToValueAtTime(gainVal, start + 0.012);
  gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(start);
  osc.stop(start + duration + 0.02);
}

function playSfx(name) {
  if (!SOUND_ENABLED) return;
  if (name === 'click') playTone(620, 0.055, 'triangle', 0.06, 0, 780);
  else if (name === 'send') playTone(520, 0.09, 'sine', 0.09, 0, 880);
  else if (name === 'recv') {
    playTone(660, 0.08, 'sine', 0.08, 0);
    playTone(990, 0.11, 'sine', 0.08, 0.07);
  } else if (name === 'gift') {
    playTone(523.25, 0.11, 'triangle', 0.11, 0);
    playTone(659.25, 0.11, 'triangle', 0.11, 0.08);
    playTone(783.99, 0.13, 'triangle', 0.12, 0.16);
    playTone(1046.5, 0.22, 'sine', 0.12, 0.24);
  } else if (name === 'pin') playTone(740, 0.07, 'sine', 0.08, 0, 1020);
  else if (name === 'error') playTone(240, 0.14, 'sawtooth', 0.07, 0, 160);
}

function toggleSound() {
  SOUND_ENABLED = !SOUND_ENABLED;
  localStorage.setItem('tg_sound', SOUND_ENABLED ? '1' : '0');
  updateSoundBtn();
  if (SOUND_ENABLED) playSfx('pin');
  toast(SOUND_ENABLED ? 'Звук включён 🔊' : 'Звук выключен 🔇');
}

function updateSoundBtn() {
  const btn = $('soundToggleBtn');
  if (!btn) return;
  btn.textContent = SOUND_ENABLED ? '🔊' : '🔇';
  btn.classList.toggle('muted', !SOUND_ENABLED);
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function toast(msg, type = 'info') {
  const d = document.createElement('div');
  d.className = 'toast';
  if (type === 'error') { d.style.background = 'linear-gradient(145deg,#f87171,#ef4444)'; d.style.color = '#fff'; }
  if (type === 'success') { d.style.background = 'linear-gradient(145deg,#6ee7b7,#10b981)'; d.style.color = '#04130d'; }
  d.textContent = msg;
  $('toastContainer').appendChild(d);
  setTimeout(() => d.remove(), 2800);
}
function closeModal() { playSfx('click'); $('mainModal').classList.remove('show'); }

async function apiGet(url) { return fetch(url, { headers: { 'x-auth-token': TOKEN } }); }
async function apiPost(url, body) {

    body: JSON.stringify(body || {})

function renderGiftArt(item, small = false) {
  const svgFallback = encodeURIComponent(getGiftSvg(item.svgType));
  return `
    <div class="gift-art-box" style="background:${item.bg || 'linear-gradient(145deg,#2c1947,#160d24)'};${small ? 'aspect-ratio:1/1;max-width:130px;margin:0 auto 8px;' : ''}">
      <div class="gift-art-pattern"></div>
      <div class="gift-art-inner">
        <img src="${escapeHtml(item.icon || '')}" alt="${escapeHtml(item.name)}"
             onerror="this.onerror=null;this.src='data:image/svg+xml;utf8,${svgFallback}';">
      </div>
    </div>`;
}

$('switchAuthMode').onclick = () => {
  playSfx('click');
  AUTH_MODE = AUTH_MODE === 'login' ? 'register' : 'login';
  $('authTitle').textContent = AUTH_MODE === 'login' ? 'Вход в TagenGram' : 'Регистрация';
  $('mainAuthBtn').textContent = AUTH_MODE === 'login' ? 'Войти' : 'Создать аккаунт';
  $('authDisplayName').style.display = AUTH_MODE === 'register' ? 'block' : 'none';
};

$('mainAuthBtn').onclick = async () => {
  const login = $('authLogin').value.trim().replace(/^@/, '');
  const password = $('authPassword').value;
  const display_name = $('authDisplayName').value.trim();
  if (!login || password.length < 6) {
    playSfx('error');
    return toast('Введите @username и пароль (от 6 симв.)', 'error');
  }
  try {
    const res = await fetch(AUTH_MODE === 'login' ? '/api/login' : '/api/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ login, password, display_name })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    TOKEN = data.token;
    localStorage.setItem('tg_token', TOKEN);
    playSfx('gift');
    bootApp();
  } catch (e) {
    playSfx('error');
    toast(e.message, 'error');
  }
};

function logout() {
  playSfx('click');
  localStorage.removeItem('tg_token');
  location.reload();
}

async function bootApp() {
  updateSoundBtn();
  if (!TOKEN) return;
  try {
    const [meRes, catRes, usersRes] = await Promise.all([apiGet('/api/me'), fetch('/api/catalog'), apiGet('/api/users')]);
    if (!meRes.ok) { localStorage.removeItem('tg_token'); return; }
    ME = await meRes.json();
    CATALOG = catRes.ok ? await catRes.json() : [];
    USERS_CACHE = usersRes.ok ? await usersRes.json() : [];

    $('authScreen').classList.remove('active');
    $('topHeader').style.display = 'flex';
    $('bottomNav').style.display = 'flex';
    updateBalances();
    switchTab('chats');

    if (pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(() => {
      if (ACTIVE_CHAT_ID) loadRoomMessages(ACTIVE_CHAT_ID, false);
      else if ($('screen-chats').classList.contains('active')) loadChats();
    }, 3000);
  } catch (e) {}
}

function updateBalances() {
  if (!ME) return;
  $('topTonVal').textContent = Number(ME.balance_ton || 0).toLocaleString('ru-RU');
  $('topStarsVal').textContent = Number(ME.balance || 0).toLocaleString('ru-RU');
  if ($('myStatTon')) $('myStatTon').textContent = Number(ME.balance_ton || 0).toLocaleString('ru-RU');
  if ($('myStatStars')) $('myStatStars').textContent = Number(ME.balance || 0).toLocaleString('ru-RU');
  if ($('myStatGifts')) $('myStatGifts').textContent = (ME.gifts || []).length;
}

function switchTab(tab) {
  ACTIVE_CHAT_ID = null;
  document.querySelectorAll('.page-screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  $('bottomNav').style.display = 'flex';
  const sc = $(`screen-${tab}`);
  if (sc) sc.classList.add('active');
  const nav = document.querySelector(`.nav-item[data-tab="${tab}"]`);
  if (nav) nav.classList.add('active');

  if (tab === 'chats') loadChats();
  if (tab === 'contacts') loadContacts();
  if (tab === 'gifts') renderGiftsStore();
  if (tab === 'profile') renderMyProfile();
}

async function loadChats() {
  try {
    const res = await apiGet('/api/chats');
    const chats = res.ok ? await res.json() : [];
    const box = $('chatsList');
    if (!chats.length) {
      box.innerHTML = '<div style="text-align:center;color:var(--dim);padding:40px;">Чатов пока нет. Откройте вкладку «Люди»!</div>';
      return;
    }
    box.innerHTML = chats.map(c => {
      const peer = c.peer;
      const avatarHtml = peer && peer.avatar_url
        ? `<img src="${escapeHtml(peer.avatar_url)}">`
        : escapeHtml(c.type === 'group' ? (c.avatar_emoji || '❄️') : (c.title || 'U')[0].toUpperCase());
      const onlineDot = peer && peer.is_online ? '<span class="online-dot"></span>' : '';
      let preview = 'Нет сообщений';
      if (c.last_message) {
        preview = c.last_message.type === 'gift'
          ? `🎁 Подарок: ${c.last_message.gift?.name || 'NFT'} ${c.last_message.gift?.serial || ''}`
          : (c.last_message.type === 'image' ? '📷 Фотография' : c.last_message.text);
      }
      return `
        <div class="chat-row" onclick="playSfx('click');openChatRoom('${escapeHtml(c.id)}', '${escapeHtml(c.title)}', ${peer ? `'${escapeHtml(peer.login)}'` : 'null'}, ${Boolean(peer && peer.is_online)})">
          <div class="avatar-circle">${avatarHtml}${onlineDot}</div>
          <div style="flex:1;min-width:0;">
            <div style="display:flex;justify-content:space-between;align-items:center;">

async function openChatRoom(chatId, title, peerLogin, isOnline) {
  ACTIVE_CHAT_ID = chatId;

  lastMsgCount = 0;
  document.querySelectorAll('.page-screen').forEach(s => s.classList.remove('active'));
  $('bottomNav').style.display = 'none';
  $('screen-room').classList.add('active');
  $('roomTitle').textContent = title;

function exitChatRoom() { switchTab('chats'); }

async function loadRoomMessages(chatId, scrollBottom = false) {
  if (ACTIVE_CHAT_ID !== chatId) return;
  try {
    const res = await apiGet(`/api/chats/${encodeURIComponent(chatId)}/messages`);
    if (!res.ok) return;
    const msgs = await res.json();
    const box = $('roomMessages');
    const wasAtBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 90;

    if (!scrollBottom && lastMsgCount > 0 && msgs.length > lastMsgCount) {
      const latest = msgs[msgs.length - 1];
      if (latest && latest.sender !== ME.login) playSfx(latest.type === 'gift' ? 'gift' : 'recv');
    }
    lastMsgCount = msgs.length;

    box.innerHTML = msgs.map(m => {
      const mine = m.sender === ME.login;
      const time = new Date(m.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const senderHeader = !mine ? `<div class="msg-sender" onclick="playSfx('click');openUserProfile('${escapeHtml(m.sender)}')">${escapeHtml(m.sender_name)} ${escapeHtml(m.sender_emoji || '')}</div>` : '';

      if (m.type === 'gift' && m.gift) {
        return `
          <div class="msg-wrap ${mine ? 'mine' : 'other'}">
            ${senderHeader}
            <div class="chat-gift-card" onclick="playSfx('click');openUserProfile('${escapeHtml(m.gift_to || m.sender)}')">
              <div class="chat-gift-badge">🎁 NFT ${escapeHtml(m.gift.serial || '')} · @${escapeHtml(m.gift_to || '')}</div>
              ${renderGiftArt(m.gift, true)}
              <div style="font-size:14.5px;font-weight:900;color:#fff;">${escapeHtml(m.gift.name)}</div>
              <div style="font-size:11.5px;color:var(--dim);margin:4px 0;">${escapeHtml(m.text || '')}</div>
              <div style="font-size:12px;font-weight:900;color:#f59e0b;">${m.gift.price_ton} TON</div>
              <div class="msg-time">${time}</div>
            </div>
          </div>`;
      }

      return `
        <div class="msg-wrap ${mine ? 'mine' : 'other'}">
          ${senderHeader}
          <div class="msg-bubble">
            ${m.image ? `<img src="${escapeHtml(m.image)}" style="max-width:100%;border-radius:12px;margin-bottom:${m.text ? '6px' : '0'};display:block;">` : ''}
            ${m.text ? `<div>${escapeHtml(m.text)}</div>` : ''}
            <div class="msg-time">${time}</div>
          </div>
        </div>`;
    }).join('');

    if (scrollBottom || wasAtBottom) box.scrollTop = box.scrollHeight;
  } catch (e) {}
}

async function sendChatText() {

  inp.value = '';
  playSfx('send');

function sendChatImage(input) {
  const file = input.files && input.files[0];
  if (!file || !ACTIVE_CHAT_ID) return;
  const reader = new FileReader();
  reader.onload = async () => {
    playSfx('send');

  input.value = '';
}

function renderGiftsStore() {
  const q = ($('giftsSearch').value || '').trim().toLowerCase();
  const sort = $('giftsSort').value;
  const favs = new Set(ME?.favorites || []);

  let list = CATALOG.filter(it => {
    if (q && !it.name.toLowerCase().includes(q)) return false;
    if (GIFT_FILTER === 'fav') return favs.has(it.id);
    if (GIFT_FILTER === 'NFT') return it.is_nft || it.tag === 'NFT';
    if (GIFT_FILTER === 'Зима') return it.tag === 'Зима';
    if (GIFT_FILTER === 'Редкий') return it.tag === 'Редкий';
    return true;
  });

  if (sort === 'price_desc') list.sort((a, b) => b.price_ton - a.price_ton);
  else if (sort === 'price_asc') list.sort((a, b) => a.price_ton - b.price_ton);
  else list.sort((a, b) => (b.popular || 0) - (a.popular || 0));

  $('giftsCount').textContent = `(${list.length})`;
  $('giftsStoreGrid').innerHTML = list.map(it => `
    <div class="gift-card" onclick="playSfx('click');openGiftBuyModal('${escapeHtml(it.id)}')">
      ${renderGiftArt(it)}
      <div class="gift-name">${escapeHtml(it.name)}</div>
      <div><span class="rarity-pill ${escapeHtml(it.rarity)}">${escapeHtml(it.rarity)}</span></div>
      <div class="gift-price-ton">${it.price_ton} TON</div>
    </div>`).join('');
}

let pendingAvatarDataUrl = null;
function handleAvatarUpload(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => { pendingAvatarDataUrl = reader.result; playSfx('pin'); toast('Фото выбрано, нажмите Сохранить', 'success'); };
  reader.readAsDataURL(file);
}

async function saveProfileEdits() {
  const body = {
    display_name: $('editProfName').value.trim(),
    status_emoji: $('editProfEmoji').value.trim(),
    bio: $('editProfBio').value.trim(),
    banner_gradient: $('editProfBanner').value
  };
  if (pendingAvatarDataUrl !== null) body.avatar_url = pendingAvatarDataUrl;
  const res = await apiPost('/api/profile/update', body);
  if (res.ok) {
    pendingAvatarDataUrl = null;
    closeModal();
    playSfx('gift');
    await bootApp();
    switchTab('profile');
    toast('Профиль обновлён!', 'success');
  }
}

async function exchangeStars() {
  const stars = parseInt($('exStarsInput').value, 10) || 0;
  try {
    const res = await apiPost('/api/wallet/exchange', { stars });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    ME.balance = data.balance;
    ME.balance_ton = data.balance_ton;
    $('exStarsInput').value = '';
    updateBalances();
    playSfx('gift');
    toast(`+${data.gained_ton} TON`, 'success');
  } catch (e) { playSfx('error'); toast(e.message, 'error'); }
}

async function openAdminModal() {
  playSfx('click');
  const res = await apiGet('/api/admin/users');
  if (!res.ok) return;
  const users = await res.json();
  const uOpts = users.map(u => `<option value="${escapeHtml(u.login)}">@${escapeHtml(u.login)} (${u.balance_ton} TON)</option>`).join('');
  const gOpts = `<option value="">-- Без подарка --</option>` + CATALOG.map(g => `<option value="${escapeHtml(g.id)}">${escapeHtml(g.name)}</option>`).join('');
  $('mainModalBody').innerHTML = `
    <h3 style="color:var(--gold-bright);margin-bottom:12px;">🛡 Админ-панель</h3>
    <select id="admTarget" class="styled-select">${uOpts}</select>
    <input type="number" id="admTon" placeholder="Добавить TON (напр. 500)">
    <input type="number" id="admStars" placeholder="Добавить ★ (напр. 10000)">
    <select id="admGift" class="styled-select">${gOpts}</select>
    <button class="btn-main btn-gold" onclick="submitAdminGive()">Выдать</button>
    <button class="btn-grey" style="width:100%;margin-top:8px;" onclick="closeModal()">Закрыть</button>`;
  $('mainModal').classList.add('show');
}

async function submitAdminGive() {
  const res = await apiPost('/api/admin/give', {
    target: $('admTarget').value,
    ton: Number($('admTon').value) || 0,
    stars: Number($('admStars').value) || 0,
    giftId: $('admGift').value
  });
  if (res.ok) {
    closeModal();
    playSfx('gift');
    toast('Выдано успешно!', 'success');
    bootApp();
  }
}

(function initSnow() {
  const c = $('snowCanvas'), ctx = c.getContext('2d');
  let w, h, flakes = [];
  function resize() {
    w = c.width = window.innerWidth; h = c.height = window.innerHeight;
    flakes = Array.from({ length: 75 }, () => ({ x: Math.random() * w, y: Math.random() * h, r: Math.random() * 2.2 + 0.8, s: Math.random() * 0.65 + 0.3 }));
  }
  function loop() {
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = 'rgba(240,247,255,0.72)';
    for (const f of flakes) {
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2); ctx.fill();
      f.y += f.s; if (f.y > h) { f.y = -4; f.x = Math.random() * w; }
    }
    requestAnimationFrame(loop);
  }
  window.addEventListener('resize', resize);
  resize(); loop();
})();

if (TOKEN) bootApp();
</script>
